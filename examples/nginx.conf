# Exemplu configurare nginx — FTB România Headless
#
# SvelteKit rulează pe localhost:3000 (Deno Deploy).
# WordPress rămâne pe același domeniu (ftbromania.ro), pe calea /incubator/.
# Nginx face proxy: rutele SvelteKit merg la app, /incubator/* și /wp-* merg la WP.

upstream sveltekit {
	server 127.0.0.1:3000;
	keepalive 64;
}

upstream wordpress {
	server 127.0.0.1:8080;
}

server {
	listen 80;
	server_name ftbromania.ro www.ftbromania.ro;
	return 301 https://$server_name$request_uri;
}

server {
	listen 443 ssl http2;
	server_name ftbromania.ro www.ftbromania.ro;

	ssl_certificate     /etc/letsencrypt/live/ftbromania.ro/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/ftbromania.ro/privkey.pem;

	# --- Rute care merg la WordPress ---

	# Admin WP
	location /incubator/ {
		proxy_pass http://wordpress;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Fișiere statice WordPress (imagini, js, css)
	location ~* ^/(wp-admin|wp-content|wp-includes|wp-json|wp-cron) {
		proxy_pass http://wordpress;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# --- Rute care merg la SvelteKit ---

	location / {
		proxy_pass http://sveltekit;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Fișiere statice SvelteKit (build output)
	location /_app/ {
		proxy_pass http://sveltekit;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}
}
